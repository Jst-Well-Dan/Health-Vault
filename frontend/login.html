<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 家庭健康档案</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="login-page">
    <form class="login-card sketch shadow" id="login-form">
      <div class="sec-label">家庭健康档案</div>
      <h1>输入家庭访问密码</h1>
      <p>登录后可在电脑和已加入 Tailscale 网络的手机上使用同一份健康档案。</p>
      <label>访问密码<input id="password" type="password" autocomplete="current-password" required autofocus /></label>
      <div id="error" class="report-import-error" hidden></div>
      <button class="btn primary" type="submit">登录</button>
      <small>密码仅保存在本机服务配置中；请勿在不受信任的网络上开放此服务。</small>
    </form>
  </main>
  <script>
    const form = document.getElementById('login-form');
    const error = document.getElementById('error');
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); error.hidden = true;
      const response = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('password').value }) });
      if (response.ok) { location.replace('/'); return; }
      const body = await response.json().catch(() => ({}));
      error.textContent = body.detail || '登录失败'; error.hidden = false;
    });
  </script>
</body>
</html>
